<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI CALCULATOR</title>
    <link rel="stylesheet" href="style.css">
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Gravitas+One&family=Quicksand:wght@300..700&display=swap');
</style>
</head>
<body>
<div class = "container">
    <div class = "box">
        <h2>BODY MASS INDEX CALCULATOR</h2>
        <div class = "content">
            <div class = "input">
                <label>Height (cm):</label>
                <input type="number" id="height" placeholder="Enter your height in cm">
            </div>
            <div class = "input">
                <label>Weight (kg):</label>
                <input type="number" id="weight" placeholder="Enter your weight in kg">
            </div>
            <button id="calculate">Calculate BMI</button>
            </div>
            <div class="result">
                <h3> YOUR BMI IS: </h3>
                <div class = "bmi" id ="result">00.00</div>
                <p class = "category"></p>
            </div>
            <hr>
            <h4> BMI CATEGORIES:
                <ul>
                    <li>Underweight: BMI &lt; 18.5</li>
                    <li>Normal weight: BMI 18.5 - 24.9</li>
                    <li>Overweight: BMI 25 - 29.9</li>
                    <li>Obesity: BMI &gt;= 30</li>
                </ul>
            </h4>
        <h6>Created by Hourain</h6>
        </div>
    </div>
</div>
<script src="index.js"></script>
</body>
